<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}DevResolve AI{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc', 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca', 800:'#3730a3', 900:'#312e81' },
            accent:  { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d' },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-hover { transition: all .2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(0,0,0,.12); }
    .sidebar-link { transition: all .15s ease; }
    .sidebar-link:hover { background: rgba(255,255,255,.12); transform: translateX(4px); }
    .sidebar-link.active { background: rgba(255,255,255,.2); border-left: 3px solid #fff; }
    .badge-open { background:#fef3c7; color:#92400e; }
    .badge-in_progress { background:#dbeafe; color:#1e40af; }
    .badge-resolved { background:#d1fae5; color:#065f46; }
    .badge-closed { background:#f3f4f6; color:#374151; }
    .badge-critical { background:#fee2e2; color:#991b1b; }
    .badge-high { background:#ffedd5; color:#9a3412; }
    .badge-medium { background:#fef3c7; color:#92400e; }
    .badge-low { background:#f0fdf4; color:#166534; }
    .ticket-row:hover { background:#f8fafc; }
    .animate-fade { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .ai-solution { background: linear-gradient(135deg, #667eea11, #764ba211); border-left: 4px solid #6366f1; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
    .markdown h2 { font-size:1.1rem; font-weight:700; margin:1rem 0 .5rem; color:#1e293b; }
    .markdown h3 { font-size:1rem; font-weight:600; margin:.8rem 0 .4rem; color:#334155; }
    .markdown p { margin:.5rem 0; color:#475569; }
    .markdown ul { list-style:disc; padding-left:1.5rem; color:#475569; }
    .markdown code { background:#f1f5f9; border-radius:4px; padding:1px 6px; font-family:monospace; font-size:.85em; color:#7c3aed; }
    .markdown pre code { display:block; padding:1rem; background:#1e293b; color:#e2e8f0; border-radius:8px; overflow-x:auto; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50">
{% block body %}{% endblock %}

<script>
// Global utilities
function showToast(msg, type='success') {
  const toast = document.createElement('div');
  const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
  toast.className = `fixed top-4 right-4 ${bg} text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-fade`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}
function toggleModal(id, show) {
  const el = document.getElementById(id);
  if(el) el.classList.toggle('hidden', !show);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
