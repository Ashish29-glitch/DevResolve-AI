{% extends "base.html" %}
{% block title %}Complete Registration - DevResolve AI{% endblock %}
{% block body %}
<div class="min-h-screen gradient-bg flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="{{avatar}}" class="w-20 h-20 rounded-full mx-auto border-4 border-white shadow-lg mb-4" onerror="this.src='https://ui-avatars.com/api/?name={{name}}&background=4f46e5&color=fff'"/>
      <h2 class="text-2xl font-bold text-white">Almost there, {{name}}!</h2>
      <p class="text-white/70 mt-1">Select your project to continue</p>
    </div>
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      {% if error is defined and error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{{error}}</div>
      {% endif %}
      <form method="post" action="/auth/google/register" class="space-y-4">
        <input type="hidden" name="email" value="{{email}}"/>
        <input type="hidden" name="name" value="{{name}}"/>
        <input type="hidden" name="google_id" value="{{google_id}}"/>
        <input type="hidden" name="avatar" value="{{avatar}}"/>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Your Email</label>
          <input type="text" value="{{email}}" disabled class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-500"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Select Project</label>
          <select name="project_id" required id="projectSelect" onchange="fetchManager(this.value)"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-400 text-sm bg-white">
            <option value="">-- Choose your project --</option>
            {% for p in projects %}
            <option value="{{p.id}}">{{p.name}}</option>
            {% endfor %}
          </select>
        </div>
        <div id="managerInfo" class="hidden p-3 bg-primary-50 rounded-xl text-sm">
          <div class="flex items-center gap-2 text-primary-700">
            <i class="fas fa-user-tie"></i>
            <span>Your Manager: <strong id="managerName"></strong></span>
          </div>
        </div>
        <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-xl font-bold hover:bg-primary-700 transition">
          Request Access <i class="fas fa-arrow-right ml-2"></i>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function fetchManager(projectId) {
  if(!projectId) { document.getElementById('managerInfo').classList.add('hidden'); return; }
  const res = await fetch(`/auth/project-info/${projectId}`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById('managerName').textContent = data.manager_name;
    document.getElementById('managerInfo').classList.remove('hidden');
  }
}
</script>
{% endblock %}
